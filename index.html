<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุขสันต์วันเกิด!</title>
    </head>
<body>
    <div id="butterfly-area" class="butterfly-container"></div>
    <div class="background-blur">
    <div class="birthday-card">
        <h1>Happy Birthday!</h1>
        <footer class="mt-4 text-muted text-center">
        <div class="container">
            <h5>&copy; A.LIFEOFBROOKLYN</h5>
        </div>
    </footer>
    </div>
    </div>
    
    <script>
    const butterflyCount = 100; // <--- ปรับจำนวนผีเสื้อที่นี่ (30, 40, 50 ตามต้องการ)
    const container = document.getElementById('butterfly-area');
    
    const butterflyImages = [
        'https://img5.pic.in.th/file/secure-sv1/01cb5d47547a36126e.png',
        'https://img2.pic.in.th/pic/025a17f8a8236c63b5.png',
        'https://img5.pic.in.th/file/secure-sv1/03902cf9836572ef41.png',
        'https://img2.pic.in.th/pic/044590d56e3540b162.png'
    ];
    
    for (let i = 0; i < butterflyCount; i++) {
        const random = (min, max) => Math.random() * (max - min) + min;

        const butterfly = document.createElement('div');
        butterfly.className = 'butterfly';

        // --- สุ่มค่าสำหรับ Duration, Delay, Hue, Flip (เหมือนเดิม) ---
        const randDuration = random(0, 1);
        const randDelay = random(0, 1);
        const randHue = Math.floor(random(0, 360));
        const randFlip = Math.random() > 0.5 ? 180 : 0; 
        
        butterfly.style.setProperty('--rand-duration', randDuration);
        butterfly.style.setProperty('--rand-delay', randDelay);
        butterfly.style.setProperty('--hue', randHue + 'deg');
        butterfly.style.setProperty('--flip', randFlip + 'deg');

        // --- เพิ่มการสุ่มตำแหน่งเริ่มต้นและระหว่างทาง (ใหม่) ---
        // ตำแหน่งเริ่มต้น
        butterfly.style.setProperty('--startX', random(-30, 0) + 'vw');
        butterfly.style.setProperty('--startY', random(0, 100) + 'vh'); // สุ่ม Y ทั่วจอ

        // จุดกลางทาง (ใช้ 3 จุดเพื่อให้เส้นทางโค้ง)
        butterfly.style.setProperty('--midX1', random(10, 40) + 'vw');
        butterfly.style.setProperty('--midY1', random(0, 100) + 'vh');
        
        butterfly.style.setProperty('--midX2', random(40, 70) + 'vw');
        butterfly.style.setProperty('--midY2', random(0, 100) + 'vh');

        butterfly.style.setProperty('--midX3', random(70, 100) + 'vw');
        butterfly.style.setProperty('--midY3', random(0, 100) + 'vh');

        // ตำแหน่งสิ้นสุด
        butterfly.style.setProperty('--endX', random(100, 130) + 'vw'); // ออกนอกจอ
        butterfly.style.setProperty('--endY', random(0, 100) + 'vh'); // สุ่ม Y ทั่วจอ

        // สุ่มการหมุนและ Scale เล็กน้อยในแต่ละจุดแวะ
        butterfly.style.setProperty('--rot1', random(-30, 30) + 'deg');
        butterfly.style.setProperty('--rot2', random(30, 90) + 'deg');
        butterfly.style.setProperty('--rot3', random(90, 180) + 'deg');
        butterfly.style.setProperty('--rot4', random(180, 270) + 'deg');
        butterfly.style.setProperty('--rot5', random(270, 360) + 'deg');

        butterfly.style.setProperty('--scale1', random(0.8, 1.2));
        butterfly.style.setProperty('--scale2', random(0.8, 1.2));
        butterfly.style.setProperty('--scale3', random(0.8, 1.2));
        butterfly.style.setProperty('--scale4', random(0.8, 1.2));
        butterfly.style.setProperty('--scale5', random(0.8, 1.2));


        // กำหนดรูปภาพผีเสื้อ
        const imgUrl = butterflyImages[Math.floor(random(0, butterflyImages.length))]; // สุ่มรูปภาพจาก list
        butterfly.style.backgroundImage = `url('${imgUrl}')`;

        container.appendChild(butterfly);
    }
    const maxParticles = 300; // จำนวนสูงสุดของอนุภาคในหน่วยความจำ
    const trailContainer = document.body; // ให้อนุภาคอยู่ใน body
    
    // รายการสีประกายไฟที่ต้องการ
    const sparkColors = ['#ffd700', '#ff69b4', '#adff2f', '#ffffff']; // ทอง, ชมพู, เขียว, ขาว
    
    let lastTime = 0;
    
    document.addEventListener('mousemove', (e) => {
        // จำกัดความถี่การสร้างอนุภาค (สร้างทุกๆ 16ms หรือประมาณ 60fps)
        if (Date.now() - lastTime < 16) {
            return;
        }
        lastTime = Date.now();

        // 1. สร้างอนุภาค
        const particle = document.createElement('div');
        particle.className = 'trail-particle';

        // 2. กำหนดตำแหน่งเริ่มต้นที่เมาส์
        particle.style.left = `${e.clientX}px`;
        particle.style.top = `${e.clientY}px`;

        // 3. สุ่มค่า offset เพื่อให้ลอยไปหลายทิศทาง
        const random = (min, max) => Math.random() * (max - min) + min;
        const xOffset = random(-30, 30);
        const yOffset = random(-50, -10); // เน้นให้ลอยขึ้น
        const randColor = sparkColors[Math.floor(random(0, sparkColors.length))];
        const randDuration = random(0.8, 1.2);

        // 4. ตั้งค่าตัวแปร CSS และแอนิเมชัน
        particle.style.setProperty('--x-offset', `${xOffset}px`);
        particle.style.setProperty('--y-offset', `${yOffset}px`);
        particle.style.setProperty('--color', randColor);
        particle.style.animationDuration = `${randDuration}s`;
        
        // 5. เพิ่มอนุภาคเข้าใน DOM
        trailContainer.appendChild(particle);

        // 6. ลบอนุภาคออกจาก DOM เมื่อแอนิเมชันจบ (เพื่อไม่ให้กินหน่วยความจำ)
        particle.addEventListener('animationend', () => {
            particle.remove();
        });
    });
    </script>

    <style>
body {
            font-family: "Krub", sans-serif;
            background: url(https://img.freepik.com/premium-photo/enchanted-meadow-with-tall-grass-wildflowers-sparkling-stream-with-butterflies-bees-buzzing-around-warm-afternoon-sun-beautiful-anime-style_1317319-5850.jpg);
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 0;
        }
        /* สไตล์ของการ์ดอวยพร */
        .birthday-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); /* เพิ่มเงาให้ดูมีมิติ */
            padding: 40px;
            text-align: center;
            width: 270px;
            z-index: 1; /* ให้การ์ดอยู่ด้านบนของพื้นหลังเบลอ */
            position: relative; /* สำคัญสำหรับการกำหนด z-index */
            /* แอนิเมชันตอนการ์ดปรากฏขึ้น */
            animation: fadeIn 2s ease-out;
        }

        /* สไตล์หัวข้อหลัก (HBD) */
        .birthday-card h1 {
            /* ใช้ฟอนต์แบบตัวเขียนเพื่อความสวยงาม */
            font-family: "Krub", sans-serif;
            font-size: 4rem; /* ขนาดตัวอักษร */
            margin: 0;
            
            /* แอนิเมชันเปลี่ยนสีตัวอักษร */
            animation: colorChange 4s infinite;
        }

        /* สไตล์ข้อความอวยพร */
        .birthday-card p {
            font-size: 1.2rem;
            color: #555;
            margin-top: 20px;
            line-height: 1.6;
        }

        /* ไอคอนเล็กๆ ด้านบน */
        .birthday-card::before {
            content: '🎉'; /* ใส่อีโมจิ */
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ---------------- */
        /* แอนิเมชัน (Keyframes) */
        /* ---------------- */

        /* แอนิเมชันสำหรับการ์ดที่ค่อยๆ ปรากฏขึ้น */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* แอนิเมชันสำหรับเปลี่ยนสีหัวข้อ */
        @keyframes colorChange {
            0%   { color: #000000d2; } /* Tomato */
            25%  { color: #000000b7; } /* Gold */
            50%  { color: #00000083; } /* LimeGreen */
            75%  { color: #00000044; } /* DodgerBlue */
            100% { color: #000000d2; } /* กลับมาสีเดิม */
        }
@keyframes flyCommon {
    0% { 
        transform: translate(var(--startX, -10vw), var(--startY, 50vh)) scale(var(--scale1, 1)) rotate(var(--rot1, 0deg)); 
        opacity: 0; 
    }
    25% { 
        opacity: 0.9; 
        transform: translate(var(--midX1, 15vw), var(--midY1, 10vh)) scale(var(--scale2, 1.1)) rotate(var(--rot2, 45deg)); 
    }
    50% { 
        transform: translate(var(--midX2, 50vw), var(--midY2, 70vh)) scale(var(--scale3, 1.2)) rotate(var(--rot3, 135deg)); 
    }
    75% { 
        transform: translate(var(--midX3, 80vw), var(--midY3, 20vh)) scale(var(--scale4, 1.1)) rotate(var(--rot4, 225deg)); 
    }
    100% { 
        transform: translate(var(--endX, 110vw), var(--endY, 50vh)) scale(var(--scale5, 1)) rotate(var(--rot5, 360deg)); 
        opacity: 0; 
    }
}
/* --- CSS สำหรับอนุภาคตามเมาส์ (Mouse Trail) --- */
@keyframes fade-up {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--x-offset), var(--y-offset)) scale(0); /* เคลื่อนที่ไปและเล็กลง */
        opacity: 0;
    }
}

.trail-particle {
    position: fixed; /* ให้อนุภาคอยู่นิ่งเมื่อ scroll (ถ้ามี) */
    width: 6px; /* ขนาดเล็กๆ */
    height: 6px;
    background-color: var(--color, gold); /* ใช้สีทองหรือสีสุ่ม */
    border-radius: 50%; /* กลม */
    pointer-events: none; /* ทำให้คลิกผ่านได้ */
    opacity: 0;
    z-index: 9999; /* ให้อยู่เหนือทุกอย่าง */
    
    /* ใช้ animation-delay เป็นค่าสุ่มเพื่อให้ดูวุ่นวาย */
    animation: fade-up 1s ease-out forwards; /* เล่น 1 วินาที และค้างที่สถานะสุดท้าย (forwards) */
}

.butterfly-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1; /* ให้อยู่ใต้ background-blur */
    overflow: hidden; /* ซ่อนผีเสื้อที่อยู่นอกจอ */
}

.butterfly {
    position: absolute;
    width: 40px; 
    height: 40px;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 0.8;
    will-change: transform, opacity; 
    transform-style: preserve-3d;

    animation-name: flyCommon;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    /* --- แก้ไข: ลบ animation-direction: alternate; ออก เพื่อไม่ให้บินกลับทาง --- */

    /* **เทคนิคการสุ่ม:** ดึงค่าจากตัวแปรที่กำหนดใน JavaScript */
    animation-duration: calc(15s + var(--rand-duration) * 10s); /* 15 ถึง 25 วินาที */
    animation-delay: calc(var(--rand-delay) * -25s); /* ใช้ค่าลบเพื่อให้เริ่มต้นที่จุดสุ่มในเส้นทางบิน */
    
    /* สุ่มสีและการหันหน้า */
    filter: hue-rotate(var(--hue, 0deg)) brightness(var(--brightness, 1)); 
    transform: rotateY(var(--flip, 0deg)); /* ใช้สำหรับสุ่มการหันหน้า */
}

/* --- แก้ไข z-index ของการ์ด ให้แน่ใจว่าอยู่หน้าสุด --- */
.birthday-card {
    /* ... โค้ดเดิมของการ์ด ... */
    z-index: 3; /* ต้องสูงกว่า background-blur (z-index: 1) และ butterfly (z-index: 0) */
    position: relative; 
}
h5 {
    color: rgb(73, 70, 70);
}
    </style>
</body>
</html>
